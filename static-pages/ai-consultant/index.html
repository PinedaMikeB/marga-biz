<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Talk to AI Product Consultant - Marga Enterprises</title>
    <meta name="description" content="Talk to Marga Enterprises AI Product Consultant for printer rental, copier rental, and print-all-you-can inquiries.">
    <link rel="canonical" href="https://marga.biz/ai-consultant/">
    <link rel="icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <link rel="stylesheet" href="/css/main.css">
    <style>
        :root {
            --consultant-ink: #101827;
            --consultant-muted: #617088;
            --consultant-blue: #0057c2;
            --consultant-orange: #ff6b00;
            --consultant-green: #0f8f63;
            --consultant-line: #d9e2ee;
            --consultant-paper: #ffffff;
            --consultant-soft: #f4f7fb;
        }

        .ai-shell {
            background:
                linear-gradient(145deg, rgba(0, 87, 194, 0.08), rgba(255, 107, 0, 0.07)),
                #f6f8fb;
        }

        .ai-hero {
            padding: 52px 0 28px;
        }

        .ai-hero-grid {
            max-width: 760px;
            margin: 0 auto;
        }

        .ai-kicker {
            display: inline-flex;
            margin-bottom: 14px;
            color: var(--consultant-blue);
            font-size: 0.82rem;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .ai-hero h1 {
            max-width: 680px;
            margin: 0 0 18px;
            color: var(--consultant-ink);
            font-size: clamp(2.1rem, 5vw, 4.4rem);
            line-height: 0.98;
            letter-spacing: 0;
        }

        .ai-hero-copy {
            max-width: 650px;
            margin: 0 0 22px;
            color: #3d4b5f;
            font-size: 1.08rem;
            line-height: 1.7;
        }

        .ai-signal-row {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: 28px;
        }

        .ai-signal {
            min-height: 110px;
            padding: 16px;
            background: rgba(255, 255, 255, 0.82);
            border: 1px solid var(--consultant-line);
            border-radius: 8px;
        }

        .ai-signal strong {
            display: block;
            margin-bottom: 7px;
            color: var(--consultant-ink);
            font-size: 1.04rem;
        }

        .ai-signal span {
            display: block;
            color: var(--consultant-muted);
            font-size: 0.93rem;
            line-height: 1.45;
        }

        .ai-console {
            position: relative;
            background: var(--consultant-paper);
            border: 1px solid var(--consultant-line);
            border-radius: 8px;
            box-shadow: 0 22px 55px rgba(16, 24, 39, 0.13);
            overflow: hidden;
        }

        .console-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 14px;
            padding: 18px 20px;
            background: #0f172a;
            color: #fff;
        }

        .console-head strong {
            font-size: 1.1rem;
        }

        .console-meta {
            display: inline-flex;
            align-items: center;
            gap: 16px;
        }

        .console-exit {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 32px;
            height: 32px;
            border: 1px solid rgba(255, 255, 255, 0.32);
            border-radius: 999px;
            color: #fff;
            text-decoration: none;
            font-size: 1.2rem;
            font-weight: 800;
            line-height: 1;
        }

        .console-exit:hover {
            background: rgba(255, 255, 255, 0.12);
        }

        .status-dot {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            font-size: 0.82rem;
            font-weight: 800;
        }

        .status-dot::before {
            content: "";
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: var(--consultant-green);
        }

        .ai-form {
            padding: 20px;
        }

        .ai-form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }

        .ai-field {
            display: flex;
            flex-direction: column;
            gap: 7px;
        }

        .ai-field.full {
            grid-column: 1 / -1;
        }

        .ai-field label {
            color: #2c3b4e;
            font-size: 0.84rem;
            font-weight: 800;
        }

        .ai-field input,
        .ai-field select,
        .ai-field textarea {
            width: 100%;
            border: 1px solid var(--consultant-line);
            border-radius: 6px;
            padding: 12px;
            color: var(--consultant-ink);
            font: inherit;
            background: #fff;
        }

        .ai-field textarea {
            min-height: 104px;
            resize: vertical;
        }

        .ai-controls {
            display: grid;
            grid-template-columns: 1fr;
            gap: 10px;
            margin-top: 16px;
        }

        .ai-primary,
        .ai-secondary {
            min-height: 48px;
            border-radius: 6px;
            border: 1px solid transparent;
            cursor: pointer;
            font-weight: 800;
            font-size: 0.98rem;
        }

        .ai-primary {
            background: var(--consultant-orange);
            color: #fff;
        }

        .ai-secondary {
            background: #fff;
            color: var(--consultant-blue);
            border-color: var(--consultant-blue);
        }

        .ai-primary:disabled,
        .ai-secondary:disabled {
            cursor: not-allowed;
            opacity: 0.7;
        }

        .ai-status {
            min-height: 46px;
            margin-top: 14px;
            padding: 12px;
            border-radius: 6px;
            background: var(--consultant-soft);
            color: var(--consultant-muted);
            font-size: 0.93rem;
            line-height: 1.5;
        }

        .ai-status.good {
            background: #eaf8f2;
            color: #08704e;
        }

        .ai-status.warn {
            background: #fff7e8;
            color: #8a5108;
        }

        .ai-status.bad {
            background: #fff0f0;
            color: #a51d2d;
        }

        .ai-call-bar {
            display: none;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 14px;
            padding: 14px;
            border-radius: 8px;
            background: #101827;
            color: #fff;
        }

        .ai-call-bar.active {
            display: flex;
        }

        .ai-call-bar button {
            border: 1px solid rgba(255, 255, 255, 0.5);
            border-radius: 6px;
            background: transparent;
            color: #fff;
            padding: 10px 14px;
            cursor: pointer;
            font-weight: 800;
        }

        @media (max-width: 920px) {
            .ai-signal-row {
                grid-template-columns: 1fr;
            }
        }

        @media (max-width: 560px) {
            .ai-form-grid {
                grid-template-columns: 1fr;
            }

            .ai-hero {
                padding-top: 34px;
            }
        }
    </style>
</head>
<body class="page ai-shell">
    <header class="site-header">
        <div class="container">
            <div class="logo">
                <a href="/">
                    <img src="/marga-logo.png" alt="Marga Enterprises" height="50" onerror="this.style.display='none';this.nextElementSibling.style.display='inline';">
                    <span style="display:none;color:#0066cc;font-weight:700;font-size:1.1rem;">Marga Enterprises</span>
                </a>
            </div>
            <button class="mobile-menu-toggle" aria-label="Toggle Menu">
                <span></span><span></span><span></span>
            </button>
            <nav class="main-nav" id="main-nav">
                <ul class="nav-menu">
                    <li class="nav-item"><a href="/" class="nav-link">Home</a></li>
                    <li class="nav-item"><a href="/printer-rental/" class="nav-link">Printer Rental</a></li>
                    <li class="nav-item"><a href="/blogs/" class="nav-link">Blog</a></li>
                    <li class="nav-item"><a href="/contact/" class="nav-link cta-link">Contact Us</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="main-content">
        <section class="ai-hero">
            <div class="container">
                <div class="ai-hero-grid">
                    <section class="ai-console" aria-label="AI Product Consultant form">
                        <div class="console-head">
                            <strong>Start consultation</strong>
                            <span class="console-meta">
                                <span class="status-dot" id="voiceStatusLabel">Ready</span>
                                <a class="console-exit" href="/contact/#email-quote" aria-label="Close and get quote by email">&times;</a>
                            </span>
                        </div>

                        <form class="ai-form" id="aiConsultantForm">
                            <div class="ai-form-grid">
                                <div class="ai-field">
                                    <label for="fullName">Full name</label>
                                    <input id="fullName" name="fullName" autocomplete="name" required>
                                </div>
                                <div class="ai-field">
                                    <label for="phone">Mobile number</label>
                                    <input id="phone" name="phone" type="tel" autocomplete="tel" placeholder="09XX XXX XXXX" required>
                                </div>
                                <div class="ai-field">
                                    <label for="email">Email</label>
                                    <input id="email" name="email" type="email" autocomplete="email" required>
                                </div>
                                <div class="ai-field">
                                    <label for="company">Company</label>
                                    <input id="company" name="company" autocomplete="organization" required>
                                </div>
                                <div class="ai-field">
                                    <label for="service">Service</label>
                                    <select id="service" name="service" required>
                                        <option value="Printer Rental">Printer Rental</option>
                                        <option value="Copier Rental">Copier Rental</option>
                                        <option value="Print All You Can">Print All You Can</option>
                                        <option value="Short-term Rental">Short-term Rental</option>
                                        <option value="Color Copier Rental">Color Copier Rental</option>
                                    </select>
                                </div>
                                <div class="ai-field">
                                    <label for="languageMode">Language</label>
                                    <select id="languageMode" name="languageMode">
                                        <option value="taglish">Taglish</option>
                                        <option value="english">Pure English</option>
                                    </select>
                                </div>
                                <div class="ai-field full">
                                    <label for="message">What do you need?</label>
                                    <textarea id="message" name="message" required placeholder="Example: Need a printer rental for 10 users in Makati, mostly black-and-white, with scanning."></textarea>
                                </div>
                            </div>

                            <div class="ai-controls">
                                <button class="ai-primary" type="button" id="startVoiceBtn">Talk Now</button>
                            </div>

                            <div class="ai-status" id="aiStatus">Microphone permission is required only when you tap Talk Now.</div>

                            <div class="ai-call-bar" id="callBar">
                                <span id="callBarText">Consultation in progress</span>
                                <button type="button" id="endCallBtn">End</button>
                            </div>
                        </form>
                    </section>
                </div>
            </div>
        </section>

    </main>

    <script src="/js/main.js" defer></script>
    <script>
        const form = document.getElementById('aiConsultantForm');
        const statusBox = document.getElementById('aiStatus');
        const startVoiceBtn = document.getElementById('startVoiceBtn');
        const callBar = document.getElementById('callBar');
        const callBarText = document.getElementById('callBarText');
        const endCallBtn = document.getElementById('endCallBtn');
        const voiceStatusLabel = document.getElementById('voiceStatusLabel');

        let currentPeer = null;
        let currentStream = null;
        let currentLeadId = '';
        let currentDataChannel = null;
        let callStartedAt = null;
        let transcriptEntries = [];
        let usageSnapshot = createEmptyUsage();
        let saveTranscriptTimer = null;

        const COST_RATES = {
            realtime: {
                textInputPerMillion: 4,
                textOutputPerMillion: 16,
                audioInputPerMillion: 32,
                audioOutputPerMillion: 64
            },
            transcription: {
                inputPerMillion: 1.25,
                outputPerMillion: 5,
                fallbackPerMinute: 0.003
            },
            usdToPhp: 57
        };

        function setStatus(message, type = '') {
            statusBox.textContent = message;
            statusBox.className = `ai-status ${type}`.trim();
        }

        function setBusy(isBusy) {
            startVoiceBtn.disabled = isBusy;
        }

        function createEmptyUsage() {
            return {
                realtimeModel: 'gpt-realtime',
                transcriptionModel: 'gpt-4o-mini-transcribe',
                responseCount: 0,
                realtime: {
                    totalTokens: 0,
                    inputTokens: 0,
                    outputTokens: 0,
                    inputTextTokens: 0,
                    inputAudioTokens: 0,
                    outputTextTokens: 0,
                    outputAudioTokens: 0
                },
                transcription: {
                    totalTokens: 0,
                    inputTokens: 0,
                    outputTokens: 0,
                    seconds: 0
                },
                estimatedCostUsd: 0,
                estimatedCostPhp: 0
            };
        }

        function roundMoney(value) {
            return Math.round((Number(value) || 0) * 10000) / 10000;
        }

        function estimateCost() {
            const realtime = usageSnapshot.realtime;
            const transcription = usageSnapshot.transcription;
            const realtimeCost =
                (realtime.inputTextTokens / 1000000) * COST_RATES.realtime.textInputPerMillion +
                (realtime.outputTextTokens / 1000000) * COST_RATES.realtime.textOutputPerMillion +
                (realtime.inputAudioTokens / 1000000) * COST_RATES.realtime.audioInputPerMillion +
                (realtime.outputAudioTokens / 1000000) * COST_RATES.realtime.audioOutputPerMillion;
            const transcriptionTokenCost =
                (transcription.inputTokens / 1000000) * COST_RATES.transcription.inputPerMillion +
                (transcription.outputTokens / 1000000) * COST_RATES.transcription.outputPerMillion;
            const transcriptionDurationCost = transcription.seconds
                ? (transcription.seconds / 60) * COST_RATES.transcription.fallbackPerMinute
                : 0;
            const total = realtimeCost + Math.max(transcriptionTokenCost, transcriptionDurationCost);
            usageSnapshot.estimatedCostUsd = roundMoney(total);
            usageSnapshot.estimatedCostPhp = roundMoney(total * COST_RATES.usdToPhp);
        }

        function addTranscriptEntry(entry) {
            const text = String(entry.text || '').trim();
            if (!text) return;
            const key = entry.itemId || entry.responseId || `${entry.role}-${Date.now()}-${transcriptEntries.length}`;
            const next = {
                id: key,
                role: entry.role,
                label: entry.role === 'assistant' ? 'AI Product Consultant' : 'Customer',
                text,
                at: entry.at || new Date().toISOString()
            };
            const existingIndex = transcriptEntries.findIndex((item) => item.id === key && item.role === entry.role);
            if (existingIndex >= 0) {
                transcriptEntries[existingIndex] = next;
            } else {
                transcriptEntries.push(next);
            }
            transcriptEntries = transcriptEntries.slice(-80);
        }

        function addRealtimeUsage(usage) {
            if (!usage) return;
            usageSnapshot.responseCount += 1;
            usageSnapshot.realtime.totalTokens += Number(usage.total_tokens || 0);
            usageSnapshot.realtime.inputTokens += Number(usage.input_tokens || 0);
            usageSnapshot.realtime.outputTokens += Number(usage.output_tokens || 0);
            usageSnapshot.realtime.inputTextTokens += Number(usage.input_token_details?.text_tokens || 0);
            usageSnapshot.realtime.inputAudioTokens += Number(usage.input_token_details?.audio_tokens || 0);
            usageSnapshot.realtime.outputTextTokens += Number(usage.output_token_details?.text_tokens || 0);
            usageSnapshot.realtime.outputAudioTokens += Number(usage.output_token_details?.audio_tokens || 0);
            estimateCost();
        }

        function addTranscriptionUsage(usage) {
            if (!usage) return;
            if (usage.type === 'duration') {
                usageSnapshot.transcription.seconds += Number(usage.seconds || 0);
            } else {
                usageSnapshot.transcription.totalTokens += Number(usage.total_tokens || 0);
                usageSnapshot.transcription.inputTokens += Number(usage.input_tokens || 0);
                usageSnapshot.transcription.outputTokens += Number(usage.output_tokens || 0);
            }
            estimateCost();
        }

        async function patchLead(updates, { keepalive = false } = {}) {
            if (!currentLeadId) return;
            await fetch('/.netlify/functions/website-inquiries', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                keepalive,
                body: JSON.stringify({ leadId: currentLeadId, updates })
            });
        }

        function queueTranscriptSave({ final = false } = {}) {
            if (!currentLeadId) return;
            clearTimeout(saveTranscriptTimer);
            const save = () => {
                const updates = {
                    transcript: transcriptEntries,
                    usage: usageSnapshot,
                    estimatedCostUsd: usageSnapshot.estimatedCostUsd,
                    estimatedCostPhp: usageSnapshot.estimatedCostPhp,
                    transcriptUpdatedAt: new Date().toISOString(),
                    realtimeModel: usageSnapshot.realtimeModel,
                    transcriptionModel: usageSnapshot.transcriptionModel
                };
                if (callStartedAt) {
                    updates.conversationDurationSeconds = Math.max(1, Math.round((Date.now() - callStartedAt.getTime()) / 1000));
                }
                if (final) {
                    updates.conversationEndedAt = new Date().toISOString();
                    updates.aiConsultantStatus = 'consultation_completed';
                    updates.aiCallStatus = 'browser_voice_completed';
                    updates.leadStatus = 'consulted';
                    updates.nextAction = 'Review transcript and decide if sales should call this prospect';
                }
                patchLead(updates, { keepalive: final }).catch((error) => console.debug('Transcript save failed', error));
            };
            if (final) {
                save();
                return;
            }
            saveTranscriptTimer = setTimeout(save, 900);
        }

        function requestQuoteDraft() {
            if (!currentLeadId) return;
            fetch('/.netlify/functions/quote-draft', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                keepalive: true,
                body: JSON.stringify({
                    leadId: currentLeadId,
                    transcript: transcriptEntries,
                    usage: usageSnapshot
                })
            }).catch((error) => console.debug('Quote draft request failed', error));
        }

        function getPayload(mode) {
            const formData = new FormData(form);
            const payload = Object.fromEntries(formData.entries());
            payload.source = 'marga.biz/ai-consultant';
            payload.sourcePage = window.location.href;
            payload.consultationMode = mode;
            payload.callConsent = false;
            return payload;
        }

        function encodeLeadHeader(value) {
            return btoa(unescape(encodeURIComponent(String(value || '').trim())));
        }

        function prefillFromQuery() {
            const params = new URLSearchParams(window.location.search);
            ['service', 'message', 'fullName', 'phone', 'email', 'company'].forEach((key) => {
                const value = params.get(key);
                const input = document.getElementById(key);
                if (value && input) input.value = value;
            });
            const language = params.get('languageMode') || params.get('language');
            if (language) {
                document.getElementById('languageMode').value = language === 'english' ? 'english' : 'taglish';
            }
        }

        async function saveLead(mode) {
            const payload = getPayload(mode);
            const response = await fetch('/.netlify/functions/create-inquiry', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || !result.success) {
                throw new Error(result.error || 'Unable to save consultation request');
            }
            currentLeadId = result.inquiryId;
            transcriptEntries = [];
            usageSnapshot = createEmptyUsage();
            callStartedAt = null;
            return { leadId: result.inquiryId, lead: result.lead || payload };
        }

        async function startBrowserVoice() {
            if (!form.reportValidity()) return;
            setBusy(true);
            setStatus('Saving your consultation request...', 'warn');

            try {
                const saved = await saveLead('talk_now');
                setStatus('Requesting microphone access...', 'warn');

                const pc = new RTCPeerConnection();
                currentPeer = pc;

                const audio = document.createElement('audio');
                audio.autoplay = true;
                audio.playsInline = true;
                audio.style.display = 'none';
                document.body.appendChild(audio);
                pc.ontrack = (event) => {
                    audio.srcObject = event.streams[0];
                    audio.play().catch((error) => console.debug('Audio playback is waiting for browser permission.', error));
                };

                currentStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                pc.addTrack(currentStream.getTracks()[0]);

                const dc = pc.createDataChannel('oai-events');
                currentDataChannel = dc;
                dc.addEventListener('open', () => {
                    callStartedAt = new Date();
                    voiceStatusLabel.textContent = 'Connected';
                    callBar.classList.add('active');
                    callBarText.textContent = 'AI Product Consultant is starting';
                    setStatus('Connected. The consultant should greet you now.', 'good');
                    dc.send(JSON.stringify({
                        type: 'response.create',
                        response: {
                            output_modalities: ['audio'],
                            instructions: document.getElementById('languageMode').value === 'english'
                                ? 'Greet the customer warmly in English only. Do not speak Chinese or any other language. Keep it short and natural: introduce yourself as Marga Enterprises AI Product Consultant, ask how they are doing, then ask how you can help or if they are planning to rent a copier or printer. Do not ask why they need a quotation yet.'
                                : 'Greet the customer warmly in Taglish only, meaning Filipino/Tagalog plus English. Do not speak Chinese, Mandarin, Cantonese, Japanese, Korean, Spanish, or any language outside Tagalog/Filipino and English. Keep it short and natural: introduce yourself as Marga Enterprises AI Product Consultant, ask how they are doing, then ask how you can help or if they are planning to rent a copier or printer. Do not ask why they need a quotation yet.'
                        }
                    }));
                });
                dc.addEventListener('message', (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'input_audio_buffer.speech_started') {
                            callBarText.textContent = 'Listening to you';
                        }
                        if (data.type === 'response.audio.delta') {
                            callBarText.textContent = 'AI Product Consultant is speaking';
                        }
                        if (data.type === 'conversation.item.input_audio_transcription.completed') {
                            addTranscriptEntry({
                                role: 'customer',
                                itemId: data.item_id,
                                text: data.transcript
                            });
                            addTranscriptionUsage(data.usage);
                            queueTranscriptSave();
                        }
                        if (data.type === 'response.output_audio_transcript.done') {
                            addTranscriptEntry({
                                role: 'assistant',
                                itemId: data.item_id,
                                responseId: data.response_id,
                                text: data.transcript
                            });
                            queueTranscriptSave();
                        }
                        if (data.type === 'response.done') {
                            callBarText.textContent = 'AI Product Consultant is listening';
                            addRealtimeUsage(data.response?.usage);
                            if (data.response?.model) usageSnapshot.realtimeModel = data.response.model;
                            queueTranscriptSave();
                        }
                        if (data.type === 'error') {
                            setStatus(data.error?.message || 'Realtime voice returned an error.', 'bad');
                        }
                    } catch (error) {
                        console.debug('Realtime event', event.data);
                    }
                });

                const offer = await pc.createOffer();
                await pc.setLocalDescription(offer);

                const response = await fetch(`/.netlify/functions/ai-consultant-session?leadId=${encodeURIComponent(saved.leadId)}`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/sdp',
                        'X-Lead-Full-Name': encodeLeadHeader(saved.lead?.fullName),
                        'X-Lead-Company': encodeLeadHeader(saved.lead?.company),
                        'X-Lead-Service': encodeLeadHeader(saved.lead?.service),
                        'X-Lead-Language-Mode': encodeLeadHeader(saved.lead?.languageMode),
                        'X-Lead-Message': encodeLeadHeader(saved.lead?.message)
                    },
                    body: offer.sdp
                });
                const answerSdp = await response.text();
                let parsedError = null;
                if (!response.ok) {
                    try {
                        parsedError = JSON.parse(answerSdp);
                    } catch (error) {
                        parsedError = null;
                    }
                    throw new Error(parsedError?.error || answerSdp || 'Voice session is not available yet');
                }

                await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
            } catch (error) {
                endCall({ finalize: false });
                const notConfigured = error.message.includes('OPENAI_API_KEY');
                setStatus(notConfigured
                    ? 'Your request was saved. Browser voice needs OPENAI_API_KEY in Netlify before live voice can start.'
                    : `Your request was saved, but voice could not start yet: ${error.message}`,
                    notConfigured ? 'warn' : 'bad');
            } finally {
                setBusy(false);
            }
        }

        function endCall({ finalize = true } = {}) {
            if (currentPeer) {
                currentPeer.getSenders().forEach((sender) => sender.track?.stop());
                currentPeer.close();
            }
            if (currentStream) currentStream.getTracks().forEach((track) => track.stop());
            currentPeer = null;
            currentStream = null;
            currentDataChannel = null;
            callBar.classList.remove('active');
            voiceStatusLabel.textContent = 'Ready';
            if (finalize && (callStartedAt || transcriptEntries.length || usageSnapshot.responseCount)) {
                queueTranscriptSave({ final: true });
                requestQuoteDraft();
            }
        }

        startVoiceBtn.addEventListener('click', startBrowserVoice);
        endCallBtn.addEventListener('click', () => {
            endCall({ finalize: true });
            setStatus(currentLeadId ? 'Consultation ended. Marga has the inquiry in the AI Product Consultant inbox.' : 'Consultation ended.', 'good');
        });
        window.addEventListener('beforeunload', () => {
            if (currentLeadId && (transcriptEntries.length || usageSnapshot.responseCount)) {
                queueTranscriptSave({ final: true });
                requestQuoteDraft();
            }
        });

        prefillFromQuery();
    </script>
</body>
</html>
