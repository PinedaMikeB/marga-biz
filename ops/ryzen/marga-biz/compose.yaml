name: marga-biz

services:
  postgres:
    image: postgres:16-alpine
    container_name: marga-biz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: marga_biz
      POSTGRES_USER: marga_biz_app
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      PGDATA: /var/lib/postgresql/data/pgdata
    command:
      - postgres
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=1GB
      - -c
      - maintenance_work_mem=128MB
      - -c
      - work_mem=8MB
      - -c
      - max_connections=50
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
      - -c
      - random_page_cost=1.1
      - -c
      - effective_io_concurrency=200
    volumes:
      - ${MARGA_BIZ_RUNTIME_ROOT:-/srv/apps/marga-biz-runtime}/postgres-data:/var/lib/postgresql/data
    secrets:
      - postgres_password
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marga_biz_app -d marga_biz"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 256
    shm_size: 256mb

networks:
  database:
    name: marga-biz-database
    internal: true

secrets:
  postgres_password:
    file: ${MARGA_BIZ_RUNTIME_ROOT:-/srv/apps/marga-biz-runtime}/secrets/postgres-password.txt
