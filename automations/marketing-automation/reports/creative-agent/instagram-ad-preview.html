<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Printer rental that keeps Pasig offices moving.</title>
  <style>
    :root {
      --ink: #143642;
      --accent: #e4572e;
      --paper: #f7f3e9;
      --panel: #ffffff;
    }
    body {
      margin: 0;
      font-family: Georgia, "Times New Roman", serif;
      background: linear-gradient(135deg, var(--paper), #ece7da);
      min-height: 100vh;
      display: grid;
      place-items: center;
      color: var(--ink);
    }
    .frame {
      width: 1080px;
      height: 1080px;
      background: radial-gradient(circle at top right, rgba(228, 87, 46, 0.15), transparent 35%), var(--panel);
      box-sizing: border-box;
      padding: 96px 88px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 4px solid rgba(20, 54, 66, 0.08);
    }
    .eyebrow {
      letter-spacing: 0.14em;
      text-transform: uppercase;
      font-size: 28px;
      color: var(--accent);
    }
    h1 {
      font-size: 96px;
      line-height: 0.95;
      margin: 0;
      max-width: 820px;
    }
    p {
      font-size: 38px;
      line-height: 1.35;
      max-width: 760px;
      margin: 0;
    }
    .cta {
      display: inline-block;
      padding: 24px 32px;
      background: var(--accent);
      color: white;
      font-size: 34px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 26px;
      border-top: 2px solid rgba(20, 54, 66, 0.12);
      padding-top: 28px;
    }
  </style>
</head>
<body>
  <div class="frame">
    <div class="eyebrow">Pasig office teams</div>
    <div>
      <h1>Printer rental that keeps Pasig offices moving.</h1>
      <p>Predictable monthly setup, clear support messaging, and a more credible local offer for decision-makers.</p>
    </div>
    <div>
      <div class="cta">Request a quick rental recommendation</div>
      <div class="footer">
        <span>Marga Enterprises</span>
        <span>Pasig business district confidence</span>
      </div>
    </div>
  </div>
</body>
</html>
