<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marga SEO Monitor</title>
    <meta name="description" content="Minimal SEO and AI search progress monitor for Marga Biz.">
    <link rel="stylesheet" href="./styles.css?v=20260617-drawer-2">
</head>
<body>
    <main class="home" aria-label="SEO monitor home">
        <header class="top">
            <div class="brand">
                <span>Marga Biz</span>
                <h1>SEO Monitor</h1>
            </div>
            <button id="menuButton" class="menu-button" type="button" aria-expanded="false" aria-controls="monitorDrawer" aria-label="Open monitor menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </header>
    </main>

    <aside id="monitorDrawer" class="drawer" aria-label="SEO monitor controls" hidden>
        <div class="drawer-head">
            <strong>Monitor</strong>
            <button id="closeMenuButton" class="close-button" type="button" aria-label="Close monitor menu">Close</button>
        </div>

        <label>
            <span>Keyword</span>
            <select id="keywordSelect">
                <option value="all">All keywords</option>
                <option value="Copier Rental">Copier Rental</option>
                <option value="Copier For Rent">Copier For Rent</option>
                <option value="Printer Rental">Printer Rental</option>
                <option value="Printer For Rent">Printer For Rent</option>
            </select>
        </label>

        <div class="date-grid">
            <label>
                <span>From</span>
                <input id="fromDate" type="date">
            </label>
            <label>
                <span>To</span>
                <input id="toDate" type="date">
            </label>
        </div>

        <section class="graph-block" aria-label="Progress graph">
            <div id="circleGraph" class="circle-graph" aria-live="polite"></div>
            <div class="progress-area">
                <div class="progress-head">
                    <span id="selectedKeywordLabel">All keywords</span>
                    <strong id="scoreLabel">--</strong>
                </div>
                <div class="progress-track">
                    <div id="progressBar" class="progress-fill"></div>
                </div>
            </div>
        </section>

        <nav class="drawer-actions" aria-label="Monitor actions">
            <button id="refreshButton" type="button">Refresh</button>
            <button id="runTodayButton" type="button">Run</button>
            <a href="/admin/insights/seo.html">Insights</a>
        </nav>

        <footer id="statusText" class="status">Loading...</footer>
    </aside>

    <div id="drawerBackdrop" class="backdrop" hidden></div>

    <script src="./app.js?v=20260617-drawer-2" defer></script>
</body>
</html>
