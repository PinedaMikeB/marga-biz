<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Marga SEO Monitor</title>
    <meta name="description" content="Minimal SEO and AI search progress monitor for Marga Biz.">
    <link rel="stylesheet" href="./styles.css?v=20260618-keyword-details">
</head>
<body>
    <main class="app" aria-label="SEO monitor">
        <header class="top">
            <div class="brand">
                <span>Marga Biz</span>
                <h1>SEO Monitor</h1>
            </div>
            <button id="menuButton" class="menu-button" type="button" aria-expanded="false" aria-controls="monitorMenu" aria-label="Open monitor menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </header>

        <section class="controls" aria-label="Monitor controls">
            <label class="keyword-field">
                <span>Keyword</span>
                <select id="keywordSelect">
                    <option value="all">All keywords</option>
                    <option value="Copier Rental">Copier Rental</option>
                    <option value="Copier For Rent">Copier For Rent</option>
                    <option value="Printer Rental">Printer Rental</option>
                    <option value="Printer For Rent">Printer For Rent</option>
                </select>
            </label>

            <div class="date-grid">
                <label>
                    <span>From</span>
                    <input id="fromDate" type="date">
                </label>
                <label>
                    <span>To</span>
                    <input id="toDate" type="date">
                </label>
            </div>
        </section>

        <section class="graph-card" aria-label="Progress graph">
            <div id="circleGraph" class="circle-graph" aria-live="polite"></div>
            <div class="progress-area">
                <div class="progress-head">
                    <span id="selectedKeywordLabel">All keywords</span>
                    <strong id="scoreLabel">--</strong>
                </div>
                <div class="progress-track">
                    <div id="progressBar" class="progress-fill"></div>
                </div>
            </div>
        </section>

        <section id="detailPanel" class="detail-panel" aria-label="Selected keyword details">
            <div class="detail-row">
                <span>Equivalent</span>
                <strong id="equivalentRank">--</strong>
            </div>
            <div class="detail-row">
                <span>Ranking Data</span>
                <strong id="rankingData">--</strong>
            </div>
            <div>
                <span class="detail-label">AI Search Ranking</span>
                <div id="aiSourceGrid" class="ai-grid"></div>
            </div>
            <div>
                <span class="detail-label">Improvement Suggestion</span>
                <p id="improvementText" class="detail-copy">--</p>
            </div>
            <div>
                <span class="detail-label">Schedule</span>
                <p id="scheduleText" class="detail-copy">--</p>
            </div>
        </section>

        <nav id="monitorMenu" class="menu-panel" aria-label="Monitor menu" hidden>
            <button id="refreshButton" type="button">Refresh</button>
            <button id="runTodayButton" type="button">Run</button>
            <a href="/admin/insights/seo.html">Insights</a>
        </nav>

        <footer id="statusText" class="status">Loading...</footer>
    </main>

    <script src="./app.js?v=20260618-keyword-details" defer></script>
</body>
</html>
